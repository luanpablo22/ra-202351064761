<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Fit - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav aria-label="Navegação principal">
            <a href="index.html">Academia Fit</a>

            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
                <li><a href="sobre.html">Sobre</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Cadastro de aluno</h1>

            <form action="#" method="post">

                <div>
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                        pattern="[A-Za-zÀ-ÿ ]{3,}"
                        title="Digite pelo menos 3 caracteres."
                    >
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div>
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        required
                        pattern="[0-9]{10,11}"
                        title="Digite apenas números, com 10 ou 11 dígitos."
                    >
                </div>

                <div>
                    <label for="idade">Idade</label>
                    <input
                        type="number"
                        id="idade"
                        name="idade"
                        min="16"
                        max="100"
                        required
                    >
                </div>

                <div>
                    <label for="objetivo">Objetivo</label>
                    <select id="objetivo" name="objetivo" required>
                        <option value="">Selecione</option>
                        <option value="massa">Ganho de massa</option>
                        <option value="emagrecimento">Emagrecimento</option>
                        <option value="condicionamento">Condicionamento</option>
                    </select>
                </div>

                <div>
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit">Cadastrar</button>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Academia Fit</p>
    </footer>

</body>
</html>
